<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05061a" />
  <title>Nuestro Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- ===================== ENTRADA + MÚSICA ===================== -->
  <audio id="bg-music" src="audio/musica.mp3" loop preload="auto"></audio>

  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <button id="intro-btn" class="intro-btn" type="button">
      <span class="intro-spark" aria-hidden="true">✦</span>
      <span id="intro-title" class="intro-title">Nuestro Universo</span>
      <span class="intro-text">Toca para entrar a nuestro universo&nbsp;✦</span>
      <span class="intro-hint" aria-hidden="true">con música</span>
    </button>
  </div>

  <button id="sound-btn" class="sound-btn" type="button" aria-label="Pausar la música" aria-pressed="true" hidden>
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18 6.4a8 8 0 0 1 0 11.2"/></svg>
    <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>

  <!-- ===================== UNIVERSO ===================== -->
  <main id="universe-view" class="view universe-view active" aria-label="Nuestro universo">
    <header class="universe-title">
      <h1 id="universe-heading">Nuestro Universo</h1>
      <p id="universe-subtitle">Toca una estrella para revivir un recuerdo</p>
    </header>

    <div class="universe-wrap">
      <div id="universe-stage" class="universe-stage">
        <svg class="orbits" viewBox="-500 -500 1000 1000" aria-hidden="true" focusable="false">
          <g id="orbit-rings"></g>
        </svg>

        <div class="central-pair">
          <button id="star-her" class="central-star her" type="button">
            <span class="cs-glow" aria-hidden="true"></span>
            <span id="label-her" class="cs-label" aria-hidden="true">Hania</span>
          </button>
          <button id="star-me" class="central-star me" type="button">
            <span class="cs-glow" aria-hidden="true"></span>
            <span id="label-me" class="cs-label" aria-hidden="true">Raúl</span>
          </button>
        </div>

        <div id="memory-stars" class="memory-stars"></div>

        <button id="secret-star" class="secret-star" type="button" aria-label="Una estrella pequeñita y escondida">
          <span aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <p id="universe-message" class="universe-message" aria-live="polite"></p>

    <footer class="chronology" aria-hidden="true">
      <span id="chrono-start"></span>
      <span class="chrono-line"></span>
      <span id="chrono-end"></span>
    </footer>

    <div id="tooltip" class="tooltip" aria-hidden="true">
      <span class="tooltip-num"></span>
      <span class="tooltip-title"></span>
      <span class="tooltip-date"></span>
    </div>
  </main>

  <!-- ===================== CONSTELACIÓN ===================== -->
  <section id="constellation-view" class="view constellation-view" aria-label="Recuerdo" aria-hidden="true" inert>
    <div class="const-top">
      <button id="back-btn" class="back-btn" type="button">
        <span aria-hidden="true">&larr;</span> <span class="back-long">Volver a nuestro universo</span><span class="back-short">Volver</span>
      </button>
      <span id="const-counter" class="const-counter" aria-hidden="true"></span>
    </div>

    <div id="const-stage" class="const-stage">
      <svg id="constellation-svg" class="constellation-svg" role="img" viewBox="0 0 100 100"
           preserveAspectRatio="xMidYMid meet" focusable="false">
        <defs>
          <radialGradient id="c-halo-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="30%" stop-color="#cfc4ff" stop-opacity="0.38" />
            <stop offset="100%" stop-color="#b9a7ff" stop-opacity="0" />
          </radialGradient>
        </defs>
      </svg>
    </div>

    <nav class="memory-nav" aria-label="Cambiar de recuerdo">
      <button id="prev-btn" type="button" aria-label="Recuerdo anterior"><span aria-hidden="true">&larr;</span></button>
      <button id="next-btn" type="button" aria-label="Recuerdo siguiente"><span aria-hidden="true">&rarr;</span></button>
    </nav>

    <aside id="memory-panel" class="memory-panel" aria-live="polite">
      <p class="panel-num" id="panel-num"></p>
      <h2 id="panel-title"></h2>
      <time class="panel-date" id="panel-date"></time>
      <p class="panel-figure" id="panel-figure"></p>
      <div class="panel-text" id="panel-text"></div>
      <p class="panel-signature" id="panel-signature">✦ nuestro universo</p>
    </aside>
  </section>

  <script src="vendor/anime.min.js"></script>
  <script src="traced.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
